name: Engine Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
            command: xvfb-run -a python3 scripts/ci.py --graphics
          - os: windows-2022
            shell: msys2 {0}
            command: python scripts/ci.py
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config libglfw3-dev libspdlog-dev libfreetype-dev libgl1-mesa-dev mono-devel xvfb xauth libgl1-mesa-dri

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-spdlog
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf

      - name: Install Windows Mono
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mono --yes --no-progress

      - name: Verify report generation
        run: python${{ runner.os == 'Linux' && '3' || '' }} -m unittest discover -s scripts/tests -v

      - name: Configure, build and test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: ${{ matrix.command }}

      - name: Upload test reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: |
            build/reports/
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/editor/tests/scenarios/
          retention-days: 14
          if-no-files-found: warn
