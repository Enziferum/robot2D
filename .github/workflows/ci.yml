name: Engine Build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      checks: write
    timeout-minutes: 40
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
            command: xvfb-run -a python3 scripts/ci.py --graphics
          - os: windows-2022
            shell: msys2 {0}
            command: python scripts/ci.py
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config libglfw3-dev libspdlog-dev libfreetype-dev libgl1-mesa-dev mono-devel xvfb xauth libgl1-mesa-dri

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # Keep Git for Windows visible for version metadata and Git fixtures.
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-spdlog
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf

      - name: Install Windows Mono
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mono --yes --no-progress

      - name: Checkout pinned GLSL validator
        uses: actions/checkout@v7
        with:
          repository: KhronosGroup/glslang
          ref: 16.6.0
          path: work/glslang-src
          persist-credentials: false

      - name: Build GLSL validator
        run: |
          cmake -S work/glslang-src -B work/glslang-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SPIRV=OFF -DENABLE_HLSL=OFF -DGLSLANG_TESTS=OFF -DGLSLANG_ENABLE_INSTALL=OFF
          cmake --build work/glslang-build --target glslang-standalone --parallel 2

      - name: Validate GLSL stages and programs
        run: python${{ runner.os == 'Linux' && '3' || '' }} scripts/validate_shaders.py --validator work/glslang-build/StandAlone/glslang${{ runner.os == 'Windows' && '.exe' || '' }} --require-version 16.6.0

      - name: Verify report generation
        env:
          GLSLANG_VALIDATOR: work/glslang-build/StandAlone/glslang${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python${{ runner.os == 'Linux' && '3' || '' }} -m unittest discover -s scripts/tests -v

      - name: Configure, build and test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: ${{ matrix.command }}

      - name: Upload test reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: |
            build/reports/
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/editor/tests/scenarios/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish test results in PR Checks
        if: >-
          !cancelled() && hashFiles('build/reports/tests.xml') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Tests (${{ matrix.os }})
          path: build/reports/tests.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          collapsed: never
          max-annotations: '0'
          use-actions-summary: 'false'
          fail-on-error: 'true'
          fail-on-empty: 'true'
