; Copy to robot2D.ini in the editor's working directory.
; Change these values while the editor is closed.
[Editor]
CameraPos=0x0
CameraSize=1280x720
; Set false to rebuild the layout from the ratios below on the next launch.
LayoutCreated=false

[Panels]
ScenePanel=true
ViewportPanel=true
GamePanel=true
InspectorPanel=true
SceneSettingsPanel=true
AssetsPanel=true
ConsolePanel=true
AnimationPanel=true
StatusBar=true

[Assets]
ThumbnailSize=64

[Layout]
Version=2
; Left and right widths as fractions of the whole dockspace.
; Both must be between 0 and 1, with a combined value below 0.95.
LeftRatio=0.11
RightRatio=0.12
; Top part of the center column (Viewport/Game above Assets/Animation).
CenterTopRatio=0.8
; Written by the editor as separate Window and Docking sections below.
[ImGuiLayout]
